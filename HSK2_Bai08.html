<!doctype html>
<html lang="vi" data-lesson="08">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 2 – Bài 8: Tuy bạn quên, nhưng tôi vẫn nhớ</title>
<style>
@font-face{font-family:"LatTNR";src:local("Times New Roman"),local("TimesNewRomanPSMT"),local("Liberation Serif"),local("Tinos");unicode-range:U+0020-007E,U+00A0-024F,U+1E00-1EFF}
@font-face{font-family:"LatTNR";font-weight:700;src:local("Times New Roman Bold"),local("TimesNewRomanPS-BoldMT"),local("Liberation Serif Bold"),local("Tinos Bold");unicode-range:U+0020-007E,U+00A0-024F,U+1E00-1EFF}
:root{
  --vermilion:#2F6B52; --vermilion-d:#1F4D3A; --vermilion-l:#E3F0E0;
  --gold:#C49A3A; --gold-l:#F8EDC6; --paper:#F4F7E6; --card:#FFFEF7; --mint:#DCEBD8;
  --ink:#1F2E27; --ink-2:#44574B; --line:#CFDDBF;
  --ok:#1D7A4A; --ok-l:#E0F3E6; --bad:#B3261E; --bad-l:#FDE8E6; --sel:#FFF1C9; --hdr:#F8EDC6;
  --k:1;
  --han:"LatTNR","Kaiti SC","STKaiti","Kaiti TC","KaiTi","KaiTi_GB2312","楷体","DFKai-SB","AR PL UKai CN","Noto Serif CJK SC",serif;
  --lat:"Times New Roman",Times,"Liberation Serif","Tinos","Nimbus Roman",serif;
}
*{box-sizing:border-box}
html{font-size:calc(17px * var(--k));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--lat);line-height:1.6;
  background-image:linear-gradient(180deg,var(--paper) 0,var(--paper) 60%,var(--mint) 100%);background-attachment:fixed}
.han,.q-han{font-family:var(--han)}
ruby{ruby-position:over;ruby-align:center;font-family:var(--han)}
.vq ruby,.opt .t.vi ruby,.wr .v.vi ruby{font-size:1.15em}
rt{font-family:var(--lat);font-size:.52em;font-weight:500;color:var(--vermilion-d);letter-spacing:.01em;line-height:1.1}
body.pm-off rt{display:none}
body.pm-hard ruby.e rt{display:none}
.hz{font-family:var(--han);font-size:1.3em;line-height:2.05}
.hz ruby{margin:0 .02em}
body.pm-off .hz{line-height:1.7}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 120px}

/* top nav + shell */
.topnav{position:sticky;top:10px;z-index:30;max-width:1280px;margin:10px auto 0;width:calc(100% - 24px);background:rgba(255,254,247,.94);backdrop-filter:blur(8px);border:2px solid var(--gold);border-radius:999px;box-shadow:0 8px 22px rgba(47,107,82,.14);display:flex;align-items:center;gap:12px;padding:6px 10px 6px 8px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.logo .mk{width:42px;height:42px;border-radius:50%;background:var(--vermilion);color:#fff;font-family:var(--han);font-size:1.4rem;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--card),0 0 0 2px var(--gold)}
.logo b{display:block;font-size:1rem;line-height:1.15;color:var(--vermilion-d)}
.logo small{display:block;font-size:.78rem;color:var(--ink-2);font-weight:700;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.tabs{flex:1 1 0;min-width:0;display:flex;gap:8px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:3px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 16px;min-height:40px;font-size:.95rem;font-weight:700;color:var(--vermilion-d);display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(47,107,82,.12)}
.tab .h{font-family:var(--han);font-size:1.2rem;font-weight:400}
.tab[aria-current=true]{background:var(--vermilion);border-color:var(--vermilion);color:#fff;box-shadow:0 3px 0 var(--vermilion-d)}
.ctl{display:flex;gap:8px;flex:none;align-items:center}
.seg{display:inline-flex;border:2px solid var(--vermilion);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:3px 11px;min-height:36px;font-size:.88rem;font-weight:700;color:var(--vermilion-d)}
.seg button[aria-pressed=true]{background:var(--vermilion);color:#fff}
.shell{max-width:1280px;margin:16px auto 80px;width:calc(100% - 24px);display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
#sideNav{max-height:calc(100vh - 250px);overflow:auto}
.sc{background:rgba(255,254,247,.96);border:2px solid var(--line);border-radius:24px;padding:12px 12px;box-shadow:0 6px 18px rgba(47,107,82,.08)}
.sc h4{margin:0 0 6px;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.sg{margin-bottom:6px}
.sg>a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--vermilion-d);font-weight:700;font-size:.98rem;padding:3px 6px;border-radius:12px}
.sg>a .n{width:30px;height:30px;border-radius:50%;background:var(--vermilion);color:#fff;font-family:var(--han);font-size:1.05rem;display:flex;align-items:center;justify-content:center;flex:none}
.sg>a .c{margin-left:auto;font-size:.78rem;color:var(--ink-2)}
.sg .ls a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:.92rem;font-weight:600;padding:5px 10px 5px 14px;margin:2px 0 2px 14px;border-radius:12px;border:2px solid transparent}
.sg .ls a:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.sg .ls a:hover{background:var(--mint)}
.sg .ls a[aria-current=true]{background:var(--mint);border-color:var(--vermilion);color:var(--vermilion-d)}
.sg .ls a.done:before{background:var(--ok)}
.sprog .row{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:var(--ink-2);margin-top:6px}
.sbtn{width:100%;margin-top:10px;border:0;border-radius:14px;background:var(--vermilion);color:#fff;font-weight:800;font-size:1rem;min-height:44px;box-shadow:0 4px 0 var(--vermilion-d)}
.sbtn:active{transform:translateY(2px)}
.wrap.mainc{max-width:none;margin:0;background:rgba(255,254,247,.97);border:2px solid var(--line);border-radius:30px;padding:20px 26px 40px;box-shadow:0 10px 30px rgba(47,107,82,.1);min-width:0}
.lab{font-size:.8rem;font-weight:700;color:var(--ink-2);display:block;margin-bottom:2px}
.prog .tr{height:10px;background:#D9E6CC;border-radius:6px;overflow:hidden}
.prog .fl{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--vermilion));transition:width .25s ease-out}
.prog small{font-size:.82rem;font-weight:700;color:var(--ink-2)}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .logo small{display:none}
  .tab .t{display:none}
}
@media (max-width:640px){
  .topnav{border-radius:22px;flex-wrap:wrap;gap:6px 8px;top:6px;padding:6px 8px}
  .logo b{font-size:.9rem}
  .tabs{order:3;flex:1 1 100%;justify-content:flex-start}
  .tab .t{display:inline}
  .tab{padding:2px 12px;min-height:36px;font-size:.85rem}
  .ctl{margin-left:auto}
  .seg button{min-height:34px;padding:2px 8px;font-size:.8rem}
  .wrap.mainc{padding:14px 12px 30px;border-radius:22px}
}
/* hero */
.hero{margin:18px 0 10px;border:2px solid var(--gold);border-radius:22px;background:var(--card);color:var(--ink);position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(47,107,82,.12)}
.hero .scene{display:block;width:100%;height:auto;aspect-ratio:800/265}
@media (max-width:640px){.hero .scene{aspect-ratio:800/340}}
.hero .txt{padding:14px 22px 18px;background:linear-gradient(180deg,#FFFEF7,var(--hdr));border-top:3px double var(--gold);position:relative}
.hero .tag{display:inline-block;background:var(--vermilion);color:#fff;font-weight:700;font-size:.8rem;padding:2px 14px;border-radius:99px;letter-spacing:.06em}
.hero h1{margin:2px 0 0;font-family:var(--han);font-size:2.3rem;line-height:1.9;font-weight:400;color:var(--vermilion-d)}
.hero h1 rt{color:var(--vermilion)}
.hero p{margin:0;font-size:1.05rem;font-weight:700;color:var(--ink-2)}
.hero .meta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{background:var(--mint);border:1px solid #B9D3BE;border-radius:99px;padding:1px 12px;font-size:.85rem;font-weight:700;color:var(--vermilion-d)}
.guide{margin:12px 0;padding:10px 14px;background:var(--gold-l);border-left:6px solid var(--gold);border-radius:10px;font-size:.95rem}
.guide b{color:var(--vermilion-d)}

/* section */
.sec{margin-top:34px}
.sec-h{display:flex;align-items:center;gap:12px;border-bottom:3px double var(--gold);padding-bottom:6px;margin-bottom:8px}
.sec-h .seal{background:var(--vermilion);color:#fff;font-family:var(--han);font-size:1.6rem;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px var(--card),0 0 0 3px var(--gold);flex:none}
.sec-h h2{margin:0;font-family:var(--han);font-weight:400;font-size:1.55rem;line-height:1.4;color:var(--vermilion-d)}
.sec-h h2 small{display:block;font-family:var(--lat);font-size:.9rem;font-weight:700;color:var(--ink-2);line-height:1.3}
.ex{margin:18px 0 8px}
.ex-h{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px}
.ex-h .no{flex:none;background:var(--gold);color:#fff;font-weight:800;border-radius:8px;padding:2px 10px;font-size:.95rem;margin-top:6px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.ex-h .ins{flex:1 1 0;min-width:0;overflow-wrap:anywhere;font-family:var(--han);font-weight:400;font-size:1.3rem;line-height:2;color:var(--vermilion-d)}
.ex-h .ins small{display:block;font-family:var(--lat);font-weight:700;color:var(--ink-2);font-size:.9rem;line-height:1.35}
.ex-h .ins small ruby,.ex-h .ins small rt{font-size:inherit}
.hh{font-family:var(--han);font-weight:400;font-size:1.2rem;line-height:1.3;color:var(--vermilion-d)}
.vnote{display:block;font-family:var(--lat);font-size:.62em;line-height:1.3;color:var(--ink-2);font-weight:600}
.passage{background:#fff;border:2px dashed var(--gold);border-radius:14px;padding:12px 18px;margin:8px 0 12px}
.passage .hz{font-size:1.3em}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.bank span{background:var(--gold-l);border:2px solid var(--gold);border-radius:10px;padding:2px 12px;font-family:var(--han);font-size:1.25rem;line-height:1.9}
.bank span b{font-family:var(--lat);color:var(--vermilion-d);margin-right:6px;font-size:.85rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0;position:relative;scroll-margin-top:96px}
.card .qn{display:inline-block;background:var(--vermilion);color:#fff;font-weight:800;border-radius:7px;font-size:.78rem;padding:1px 9px;margin-right:8px;vertical-align:middle}
.card .qt{font-size:1.08rem;font-weight:600}
.card .qt.hz{font-weight:400}
.card .qt .blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink-2);margin:0 4px}
.opts{display:grid;gap:8px;margin-top:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 12px;min-height:48px;font-size:1.05rem;color:var(--ink)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold-l);color:var(--vermilion-d);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-family:var(--lat)}
.opt .t{font-family:var(--han);font-size:1.2rem;line-height:1.9}
.opt .t.vi{font-family:var(--lat);font-size:1.05rem;line-height:1.4}
.opt:hover{border-color:var(--gold);background:#FBFAEA}
.opt[aria-pressed=true]{border-color:var(--vermilion);background:var(--sel);box-shadow:0 0 0 2px var(--vermilion) inset}
.opt[aria-pressed=true] .l{background:var(--vermilion);color:#fff}
input.ans,textarea.ans,select.ans{width:100%;font-family:var(--han);font-size:1.3rem;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:8px;min-height:52px}
textarea.ans{line-height:1.8;resize:vertical;min-height:140px}
input.ans:focus,textarea.ans:focus,select.ans:focus{border-color:var(--vermilion);outline:none;box-shadow:0 0 0 3px rgba(47,107,82,.25)}
select.inl{font-family:var(--han);font-size:1.15rem;padding:2px 8px;border:2px solid var(--vermilion);border-radius:10px;background:#fff;color:var(--ink);min-height:44px;max-width:100%;margin:2px 4px}
select.ans{font-family:var(--lat);font-size:1.05rem;width:auto;min-width:220px;max-width:100%}
.hint{margin-top:6px;font-size:.88rem;color:var(--ink-2)}
.hint b{color:var(--vermilion-d)}
.reqs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reqs span{background:var(--vermilion-l);border:1px solid #B9D3BE;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:600;color:var(--vermilion-d)}
.build{margin-top:8px}
.build .out{min-height:62px;border:2px dashed var(--gold);background:#fff;border-radius:12px;padding:4px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.build .pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:2px solid var(--gold);background:var(--gold-l);border-radius:10px;padding:0 12px;min-height:44px;font-family:var(--han);font-size:1.2rem;line-height:1.9;color:var(--ink)}
.chip:hover{background:#FFF1C9}
.chip.used{opacity:.25;pointer-events:none}
.out .chip{background:var(--sel);border-color:var(--vermilion)}
.mini{border:2px solid var(--line);background:#fff;border-radius:10px;font-size:.8rem;font-weight:700;padding:4px 12px;margin-top:8px;min-height:40px;color:var(--ink-2)}
.ph{color:#8C9A86;font-size:.85rem}

/* states after submit */
.card.ok{border-color:var(--ok);background:var(--ok-l)}
.card.no{border-color:var(--bad);background:var(--bad-l)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.82rem;border-radius:99px;padding:2px 12px;margin-top:8px}
.badge.ok{background:var(--ok);color:#fff}
.badge.no{background:var(--bad);color:#fff}
.badge a{color:#fff;text-decoration:underline;margin-left:6px}
.opt.right{border-color:var(--ok);background:#D6F0E0}
.opt.wrong{border-color:var(--bad);background:#FAD4D0}
.locked .opt,.locked .chip{pointer-events:none}

/* submit */
.submit{margin:34px 0 10px;text-align:center}
.btn{border:0;border-radius:14px;padding:14px 34px;font-size:1.1rem;font-weight:800;min-height:54px}
.btn.pri{background:var(--vermilion);color:#fff;box-shadow:0 5px 0 var(--vermilion-d)}
.btn.pri:hover{background:#3B7F63}
.btn.pri:active{transform:translateY(3px);box-shadow:0 2px 0 var(--vermilion-d)}
.btn.sec{background:#fff;border:2px solid var(--vermilion);color:var(--vermilion-d);margin:4px}
.warn{display:none;margin:14px auto;max-width:560px;background:var(--gold-l);border:2px solid var(--gold);border-radius:14px;padding:12px 16px;font-weight:600}
.warn.on{display:block}

/* result */
.result{margin-top:30px;display:none}
.result.on{display:block}
.score{border:3px solid var(--vermilion);border-radius:20px;background:#fff;padding:20px;text-align:center}
.score h2{margin:0 0 6px;color:var(--vermilion-d)}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.stat{min-width:110px;border-radius:14px;padding:8px 14px;border:2px solid var(--line)}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{font-size:.82rem;font-weight:700}
.stat.g{border-color:var(--ok);color:var(--ok);background:var(--ok-l)}
.stat.r{border-color:var(--bad);color:var(--bad);background:var(--bad-l)}
.stat.n{border-color:var(--gold);color:var(--vermilion-d);background:var(--gold-l)}
.secs{display:grid;gap:6px;margin-top:10px;text-align:left}
.secrow{display:grid;grid-template-columns:minmax(120px,210px) 1fr 64px;gap:10px;align-items:center;font-size:.85rem;font-weight:600}
.secrow .tr{height:12px;background:#D9E6CC;border-radius:7px;overflow:hidden}
.secrow .fl{height:100%;background:var(--ok)}
.explain{margin-top:26px}
.explain h3{color:var(--vermilion-d);border-bottom:3px double var(--gold);padding-bottom:4px}
.wr{background:#fff;border:2px solid var(--bad);border-left-width:8px;border-radius:14px;padding:12px 16px;margin:12px 0}
.wr .hd{font-weight:800;color:var(--bad);font-size:.9rem}
.wr .hd small{color:var(--ink-2);font-weight:600}
.wr .qq{margin:6px 0;font-weight:600}
.wr .qq.hz{font-weight:400}
.wr .you,.wr .key,.wr .why{border-radius:10px;padding:6px 12px;margin-top:6px;font-size:.95rem}
.wr .you{background:var(--bad-l)}
.wr .key{background:var(--ok-l)}
.wr .why{background:var(--gold-l);border:1px dashed var(--gold)}
.wr .lb{display:block;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;font-weight:800}
.wr .you .v,.wr .key .v{font-family:var(--han);font-size:1.2rem;line-height:2}
.wr .you .v.vi,.wr .key .v.vi{font-family:var(--lat);font-size:1.05rem;line-height:1.5}
.allright{background:var(--ok-l);border:2px solid var(--ok);border-radius:14px;padding:14px 18px;font-weight:700;color:var(--ok)}
.review{margin-top:26px}
.review h3{color:var(--vermilion-d);border-bottom:3px double var(--gold);padding-bottom:4px}
table.vt{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
table.vt th,table.vt td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.vt th{background:var(--vermilion);color:#fff;font-size:.8rem}
table.vt td.h{font-family:var(--han);font-size:1.25rem;line-height:2.1}
table.vt td.p{font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.gp{background:#fff;border:2px solid var(--line);border-left:8px solid var(--gold);border-radius:12px;padding:10px 16px;margin:10px 0}
.gp h4{margin:0 0 4px;color:var(--vermilion-d)}
.gp .eg{font-family:var(--han);font-size:1.2rem;line-height:2.1}
.dlg{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 16px;margin:10px 0}
.dlg h4{margin:6px 0 0;color:var(--vermilion-d)}
.dlg .ln{display:flex;gap:10px;align-items:baseline}
.dlg .who{flex:none;font-size:.75rem;font-weight:800;color:var(--gold);min-width:64px}
.dlg .tx{font-family:var(--han);font-size:1.2rem;line-height:2.1}
footer{margin-top:40px;text-align:center;font-size:.78rem;color:var(--ink-2)}
@media (max-width:560px){
  html{font-size:calc(16px * var(--k))}
  .hero h1{font-size:1.7rem}
  .ex-h .ins{font-size:1.15rem}
  .sec-h h2{font-size:1.3rem}
  .secrow{grid-template-columns:1fr 64px}.secrow .tr{grid-column:1/-1;order:3}
  .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.bar,.submit{display:none}}
</style>

<body class="pm-hard">
<header class="topnav">
  <div class="logo"><div class="mk">汉</div><div><b id="barTitle">HSK 2</b><small id="barSub"></small></div></div>
  <nav class="tabs" id="tabs" aria-label="Các phần của bài"></nav>
  <div class="ctl">
    <div class="seg" role="group" aria-label="Phiên âm" id="pmSeg">
      <button type="button" data-m="pm-off" aria-pressed="false">Ẩn</button>
      <button type="button" data-m="pm-hard" aria-pressed="true">Pinyin</button>
      <button type="button" data-m="pm-all" aria-pressed="false">Tất cả</button>
    </div>
    <div class="seg" role="group" aria-label="Cỡ chữ" id="fsSeg">

u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"h\">\u003cruby>点\u003crt>diǎn\u003c/rt>\u003c/ruby>\u003c/td>\u003ctd class=\"p\">diǎn\u003c/td>\u003ctd class=\"p\">v.\u003c/td>\u003ctd>gọi (món); chọn\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"h\">\u003cruby>虽然\u003crt>suīrán\u003c/rt>\u003c/ruby>\u003c/td>\u003ctd class=\"p\">suīrán\u003c/td>\u003ctd class=\"p\">conj.\u003c/td>\u003ctd>tuy, mặc dù\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"h\">\u003cruby>但是\u003crt>dànshì\u003c/rt>\u003c/ruby>\u003c/td>\u003ctd class=\"p\">dànshì\u003c/td>\u003ctd class=\"p\">conj.\u003c/td>\u003ctd>nhưng\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"h\">\u003cruby>花\u003crt>huā\u003c/rt>\u003c/ruby>\u003c/td>\u003ctd class=\"p\">huā\u003c/td>\u003ctd class=\"p\">v.\u003c/td>\u003ctd>tiêu (tiền, thời gian); hoa\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"h\">\u003cruby>妻子\u003crt>qīzi\u003c/rt>\u003c/ruby>\u003c/td>\u003ctd class=\"p\">qīzi\u003c/td>\u003ctd class=\"p\">n.\u003c/td>\u003ctd>vợ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"h\">\u003cruby>丈夫\u003crt>zhàngfu\u003c/rt>\u003c/ruby>\u003c/td>\u003ctd class=\"p\">zhàngfu\u003c/td>\u003ctd class=\"p\">n.\u003c/td>\u003ctd>chồng\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"h\">\u003cruby>饭馆\u003crt>fànguǎn\u003c/rt>\u003c/ruby>\u003c/td>\u003ctd class=\"p\">fànguǎn\u003c/td>\u003ctd class=\"p\">n.\u003c/td>\u003ctd>quán ăn, nhà hàng\u003c/td>\u003c/tr>\u003c/table>\u003ch4 style=\"margin:16px 0 4px;color:var(--vermilion-d)\">Ngữ pháp trọng điểm\u003c/h4>\u003cdiv class=\"gp\">\u003ch4>\u003cruby>比较\u003crt>bǐjiào\u003c/rt>\u003c/ruby>\u003cruby>句\u003crt>jù\u003c/rt>\u003c/ruby> (1) – Câu so sánh (1)\u003c/h4>\u003cdiv>Dùng giới từ “比” để so sánh sự khác nhau về tính chất, trạng thái. Cấu trúc: \u003cb>A + 比 + B + tính từ / cụm tính từ\u003c/b>.\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">也\u003crt>yě\u003c/rt>\u003c/ruby>\u003cruby>觉得\u003crt>juéde\u003c/rt>\u003c/ruby>\u003cruby>左边\u003crt>zuǒbiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby>比\u003crt>bǐ\u003c/rt>\u003c/ruby>\u003cruby>右边\u003crt>yòubiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">好看\u003crt>hǎokàn\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">今天\u003crt>jīntiān\u003c/rt>\u003c/ruby>\u003cruby>比\u003crt>bǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">昨天\u003crt>zuótiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">冷\u003crt>lěng\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">他\u003crt>tā\u003c/rt>\u003c/ruby>\u003cruby>觉得\u003crt>juéde\u003c/rt>\u003c/ruby>\u003cruby>踢足球\u003crt>tīzúqiú\u003c/rt>\u003c/ruby>\u003cruby>比\u003crt>bǐ\u003c/rt>\u003c/ruby>\u003cruby>打篮球\u003crt>dǎlánqiú\u003c/rt>\u003c/ruby>\u003cruby>有意思\u003crt>yǒuyìsi\u003c/rt>\u003c/ruby>。\u003c/div>\u003c/div>\u003cdiv class=\"gp\">\u003ch4>\u003cruby>比较\u003crt>bǐjiào\u003c/rt>\u003c/ruby>\u003cruby>句\u003crt>jù\u003c/rt>\u003c/ruby> (2) – Câu so sánh (2)\u003c/h4>\u003cdiv>Trong câu so sánh với “比”, \u003cb>trước tính từ không dùng\u003c/b> 很、非常… Muốn tăng mức độ thì dùng \u003cb>还\u003c/b> hoặc \u003cb>更\u003c/b>: A + 比 + B + 还/更 + Adj.\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>\u003cruby>网上\u003crt>wǎngshàng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">说\u003crt>shuō\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">这个\u003crt>zhège\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">电影\u003crt>diànyǐng\u003c/rt>\u003c/ruby>\u003cruby>比\u003crt>bǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">那个\u003crt>nàge\u003c/rt>\u003c/ruby>\u003cruby>爱情片\u003crt>àiqíngpiàn\u003c/rt>\u003c/ruby>\u003cruby>更\u003crt>gèng\u003c/rt>\u003c/ruby>\u003cruby>有意思\u003crt>yǒuyìsi\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">今天\u003crt>jīntiān\u003c/rt>\u003c/ruby>\u003cruby>比\u003crt>bǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">昨天\u003crt>zuótiān\u003c/rt>\u003c/ruby>\u003cruby>更热\u003crt>gèngrè\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby>觉得\u003crt>juéde\u003c/rt>\u003c/ruby>\u003cruby>奶茶\u003crt>nǎichá\u003c/rt>\u003c/ruby>\u003cruby>比\u003crt>bǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">牛奶\u003crt>niúnǎi\u003c/rt>\u003c/ruby>\u003cruby>还\u003crt>hái\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">好喝\u003crt>hǎohē\u003c/rt>\u003c/ruby>。\u003c/div>\u003c/div>\u003cdiv class=\"gp\">\u003ch4>\u003cruby>转折\u003crt>zhuǎnzhé\u003c/rt>\u003c/ruby>\u003cruby>复句\u003crt>fùjù\u003c/rt>\u003c/ruby>“\u003cruby>虽然\u003crt>suīrán\u003c/rt>\u003c/ruby>……，\u003cruby>但是\u003crt>dànshì\u003c/rt>\u003c/ruby>……” – Câu chuyển ngoặt\u003c/h4>\u003cdiv>“虽然” và “但是” có thể dùng thành cặp, cũng có thể chỉ dùng một trong hai. Vế sau nêu ý ngược lại / chuyển ngoặt.\u003c/div>\u003cdiv class=\"eg\">\u003cruby>虽然\u003crt>suīrán\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">你\u003crt>nǐ\u003c/rt>\u003c/ruby>\u003cruby>忘\u003crt>wàng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>，\u003cruby>但是\u003crt>dànshì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby>记得\u003crt>jìde\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby>外边\u003crt>wàibiān\u003c/rt>\u003c/ruby>\u003cruby>下雪\u003crt>xiàxuě\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>，\u003cruby>但是\u003crt>dànshì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">不\u003crt>bú\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">太冷\u003crt>tàilěng\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby>虽然\u003crt>suīrán\u003c/rt>\u003c/ruby>\u003cruby>觉得\u003crt>juéde\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">有点儿\u003crt>yǒudiǎn'ér\u003c/rt>\u003c/ruby>\u003cruby>累\u003crt>lèi\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby>还是\u003crt>háishì\u003c/rt>\u003c/ruby>\u003cruby>走\u003crt>zǒu\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">回家\u003crt>huíjiā\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>。\u003c/div>\u003c/div>\u003ch4 style=\"margin:16px 0 4px;color:var(--vermilion-d)\">Bài khoá\u003c/h4>\u003cdiv class=\"dlg\">\u003ch4>课文 1 – Chọn đồng hồ\u003c/h4>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">你\u003crt>nǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>，\u003cruby>这两块\u003crt>zhèliǎngkuài\u003c/rt>\u003c/ruby>\u003cruby>手表\u003crt>shǒubiǎo\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">怎么样\u003crt>zěnmeyàng\u003c/rt>\u003c/ruby>？\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">都\u003crt>dōu\u003c/rt>\u003c/ruby>\u003cruby>不错\u003crt>búcuò\u003c/rt>\u003c/ruby>！\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">喜欢\u003crt>xǐhuan\u003c/rt>\u003c/ruby>\u003cruby>左边\u003crt>zuǒbiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">这个\u003crt>zhège\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">也\u003crt>yě\u003c/rt>\u003c/ruby>\u003cruby>觉得\u003crt>juéde\u003c/rt>\u003c/ruby>\u003cruby>左边\u003crt>zuǒbiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby>比\u003crt>bǐ\u003c/rt>\u003c/ruby>\u003cruby>右边\u003crt>yòubiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">好看\u003crt>hǎokàn\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">你\u003crt>nǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看看\u003crt>kànkàn\u003c/rt>\u003c/ruby>\u003cruby>要\u003crt>yào\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">多少\u003crt>duōshao\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">钱\u003crt>qián\u003c/rt>\u003c/ruby>！\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">真\u003crt>zhēn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">不\u003crt>bú\u003c/rt>\u003c/ruby>\u003cruby>便宜\u003crt>biànyí\u003c/rt>\u003c/ruby>！\u003cruby class=\"e\">八千\u003crt>bāqiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">八\u003crt>bā\u003c/rt>\u003c/ruby>！\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"dlg\">\u003ch4>课文 2 – Chọn phim\u003c/h4>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">今天\u003crt>jīntiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">有\u003crt>yǒu\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">不少\u003crt>bùshǎo\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">电影\u003crt>diànyǐng\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">我们\u003crt>wǒmen\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看个\u003crt>kàngè\u003c/rt>\u003c/ruby>\u003cruby>电影吧\u003crt>diànyǐngba\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">好\u003crt>hǎo\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">啊\u003crt>a\u003c/rt>\u003c/ruby>！\u003cruby class=\"e\">我们\u003crt>wǒmen\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">哪个\u003crt>nǎge\u003c/rt>\u003c/ruby>？\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby>记得\u003crt>jìde\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">你\u003crt>nǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">喜欢\u003crt>xǐhuan\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>\u003cruby>爱情片\u003crt>àiqíngpiàn\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">我们\u003crt>wǒmen\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">那个\u003crt>nàge\u003c/rt>\u003c/ruby>\u003cruby>爱情片\u003crt>àiqíngpiàn\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">怎么样\u003crt>zěnmeyàng\u003c/rt>\u003c/ruby>？\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby>还是\u003crt>háishì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">这个\u003crt>zhège\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">吧\u003crt>ba\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>\u003cruby>网上\u003crt>wǎngshàng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">说\u003crt>shuō\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">这个\u003crt>zhège\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">电影\u003crt>diànyǐng\u003c/rt>\u003c/ruby>\u003cruby>比\u003crt>bǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">那个\u003crt>nàge\u003c/rt>\u003c/ruby>\u003cruby>爱情片\u003crt>àiqíngpiàn\u003c/rt>\u003c/ruby>\u003cruby>更\u003crt>gèng\u003c/rt>\u003c/ruby>\u003cruby>有意思\u003crt>yǒuyìsi\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">好\u003crt>hǎo\u003c/rt>\u003c/ruby>。\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">去\u003crt>qù\u003c/rt>\u003c/ruby>\u003cruby>买票\u003crt>mǎipiào\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">到\u003crt>dào\u003c/rt>\u003c/ruby>\u003cruby>网上\u003crt>wǎngshàng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">买\u003crt>mǎi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">吧\u003crt>ba\u003c/rt>\u003c/ruby>，\u003cruby>网上\u003crt>wǎngshàng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">买\u003crt>mǎi\u003c/rt>\u003c/ruby>\u003cruby>比\u003crt>bǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">在\u003crt>zài\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">这里\u003crt>zhèlǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">买\u003crt>mǎi\u003c/rt>\u003c/ruby>\u003cruby>便宜\u003crt>piányi\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"dlg\">\u003ch4>课文 3 – Gọi món\u003c/h4>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby>您好\u003crt>nínhǎo\u003c/rt>\u003c/ruby>！\u003cruby>就要\u003crt>jiùyào\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">这\u003crt>zhè\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">几个\u003crt>jǐgè\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">菜\u003crt>cài\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">吧\u003crt>ba\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">谢谢\u003crt>xièxie\u003c/rt>\u003c/ruby>！\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">怎么\u003crt>zěnme\u003c/rt>\u003c/ruby>\u003cruby>点\u003crt>diǎn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">这么\u003crt>zhème\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">多菜\u003crt>duōcài\u003c/rt>\u003c/ruby>？\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">你\u003crt>nǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">想想\u003crt>xiǎngxiǎng\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">今天\u003crt>jīntiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">是\u003crt>shì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">几月\u003crt>jǐyuè\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">几号\u003crt>jǐhào\u003c/rt>\u003c/ruby>？\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">八月\u003crt>bāyuè\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">二十七\u003crt>èrshíqī\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">号\u003crt>hào\u003c/rt>\u003c/ruby>。\u003cruby class=\"e\">啊\u003crt>a\u003c/rt>\u003c/ruby>！\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby>生日\u003crt>shēngrì\u003c/rt>\u003c/ruby>！\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby>生日快乐\u003crt>shēngrìkuàilè\u003c/rt>\u003c/ruby>！\u003cruby>虽然\u003crt>suīrán\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">你\u003crt>nǐ\u003c/rt>\u003c/ruby>\u003cruby>忘\u003crt>wàng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>，\u003cruby>但是\u003crt>dànshì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby>记得\u003crt>jìde\u003c/rt>\u003c/ruby>。\u003cruby class=\"e\">看看\u003crt>kànkàn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">这是\u003crt>zhèshì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">什么\u003crt>shénme\u003c/rt>\u003c/ruby>？\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby>手表\u003crt>shǒubiǎo\u003c/rt>\u003c/ruby>！\u003cruby class=\"e\">吃饭\u003crt>chīfàn\u003c/rt>\u003c/ruby>、\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">电影\u003crt>diànyǐng\u003c/rt>\u003c/ruby>、\u003cruby class=\"e\">买\u003crt>mǎi\u003c/rt>\u003c/ruby>\u003cruby>手表\u003crt>shǒubiǎo\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">今天\u003crt>jīntiān\u003c/rt>\u003c/ruby>\u003cruby>花\u003crt>huā\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">不少\u003crt>bùshǎo\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">钱\u003crt>qián\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">吧\u003crt>ba\u003c/rt>\u003c/ruby>？\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘明\u003c/span>\u003cspan class=\"tx\">\u003cruby>虽然\u003crt>suīrán\u003c/rt>\u003c/ruby>\u003cruby>花\u003crt>huā\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">一些\u003crt>yìxiē\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">钱\u003crt>qián\u003c/rt>\u003c/ruby>，\u003cruby>但是\u003crt>dànshì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">我们\u003crt>wǒmen\u003c/rt>\u003c/ruby>\u003cruby>过\u003crt>guò\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">一个\u003crt>yígè\u003c/rt>\u003c/ruby>\u003cruby>快乐\u003crt>kuàilè\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby>生日\u003crt>shēngrì\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"dlg\">\u003ch4>课文 4 – Sinh nhật của người vợ\u003c/h4>\u003cdiv class=\"ln\">\u003cspan class=\"tx\">\u003cruby>虽然\u003crt>suīrán\u003c/rt>\u003c/ruby>\u003cruby>妻子\u003crt>qīzi\u003c/rt>\u003c/ruby>\u003cruby>忘\u003crt>wàng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">今天\u003crt>jīntiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">是\u003crt>shì\u003c/rt>\u003c/ruby>\u003cruby>自己\u003crt>zìjǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby>生日\u003crt>shēngrì\u003c/rt>\u003c/ruby>，\u003cruby>但是\u003crt>dànshì\u003c/rt>\u003c/ruby>\u003cruby>丈夫\u003crt>zhàngfu\u003c/rt>\u003c/ruby>\u003cruby>记得\u003crt>jìde\u003c/rt>\u003c/ruby>。\u003cruby>丈夫\u003crt>zhàngfu\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">请\u003crt>qǐng\u003c/rt>\u003c/ruby>\u003cruby>妻子\u003crt>qīzi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">去\u003crt>qù\u003c/rt>\u003c/ruby>\u003cruby>饭馆\u003crt>fànguǎn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">吃饭\u003crt>chīfàn\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">去\u003crt>qù\u003c/rt>\u003c/ruby>\u003cruby>电影院\u003crt>diànyǐngyuàn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">电影\u003crt>diànyǐng\u003c/rt>\u003c/ruby>，\u003cruby>还给\u003crt>huángěi\u003c/rt>\u003c/ruby>\u003cruby>妻子\u003crt>qīzi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">买\u003crt>mǎi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">一块\u003crt>yíkuài\u003c/rt>\u003c/ruby>\u003cruby>非常\u003crt>fēicháng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">漂亮\u003crt>piàoliang\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby>手表\u003crt>shǒubiǎo\u003c/rt>\u003c/ruby>。\u003cruby>妻子\u003crt>qīzi\u003c/rt>\u003c/ruby>\u003cruby>觉得\u003crt>juéde\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">今天\u003crt>jīntiān\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">很\u003crt>hěn\u003c/rt>\u003c/ruby>\u003cruby>快乐\u003crt>kuàilè\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003c/div>"}</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
var app=document.getElementById('app');
var ALL=[];           // flattened items
var submitted=false;

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var PUNCT=/[\s　，。！？、；：“”‘’（）()《》…,.!?;:'"~·—\-_\[\]【】]/g;
function norm(s){return String(s||'').replace(PUNCT,'').toLowerCase()}
var LET='ABCDEFGH';
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* ---------- toolbar ---------- */
function setPm(m){
  document.body.className=m;
  [].forEach.call(document.querySelectorAll('#pmSeg button'),function(b){b.setAttribute('aria-pressed',b.dataset.m===m)});
  store('hsk2pm',m);
}
function setK(k){
  document.documentElement.style.setProperty('--k',k);
  [].forEach.call(document.querySelectorAll('#fsSeg button'),function(b){b.setAttribute('aria-pressed',b.dataset.k===String(k))});
  store('hsk2k',k);
}
document.getElementById('pmSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setPm(b.dataset.m)});
document.getElementById('fsSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setK(b.dataset.k)});
setPm(load('hsk2pm')||'pm-hard');setK(load('hsk2k')||'1');
document.getElementById('barTitle').textContent='HSK 2 · Bài '+D.no;document.getElementById('barSub').textContent=D.titleVi;

/* ---------- item builders ---------- */
function mkMcq(it,card,labelsVi){
  var wrap=el('div','opts'),val=null,btns=[];
  it.o.forEach(function(o,i){
    var b=el('button','opt','<span class="l">'+LET[i]+'</span><span class="t'+(it.lo?' vi':'')+'">'+o+'</span>');
    b.type='button';b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){ if(submitted)return; val=i;btns.forEach(function(x,j){x.setAttribute('aria-pressed',j===i)});progress()});
    btns.push(b);wrap.appendChild(b);
  });
  card.appendChild(wrap);
  return {get:function(){return val},empty:function(){return val===null},
    mark:function(key){btns.forEach(function(b,j){if(j===key)b.classList.add('right');else if(j===val)b.classList.add('wrong')})}};
}
function mkTf(it,card){
  var val=null,btns=[],wrap=el('div','opts');
  [['Đúng','✓ Đúng',true],['Sai','✗ Sai',false]].forEach(function(o,i){
    var b=el('button','opt','<span class="l">'+(i?'S':'Đ')+'</span><span class="t vi">'+o[1]+'</span>');
    b.type='button';b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){ if(submitted)return; val=o[2];btns.forEach(function(x,j){x.setAttribute('aria-pressed',j===i)});progress()});
    btns.push(b);wrap.appendChild(b);
  });
  card.appendChild(wrap);
  return {get:function(){return val},empty:function(){return val===null},
    mark:function(key){btns.forEach(function(b,j){var v=j===0;if(v===key)b.classList.add('right');else if(v===val)b.classList.add('wrong')})}};
}
function mkText(it,card,multi){
  var inp=multi?el('textarea','ans'):el('input','ans');
  if(!multi){inp.type='text'}
  inp.setAttribute('lang','zh-CN');inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','off');inp.setAttribute('spellcheck','false');
  inp.setAttribute('aria-label','Câu trả lời của câu '+it._n);
  inp.placeholder=it.ph||(multi?'Viết đoạn văn bằng chữ Hán…':'Gõ chữ Hán vào đây…');
  inp.addEventListener('input',progress);
  card.appendChild(inp);
  return {get:function(){return inp.value},empty:function(){return !inp.value.trim()},lock:function(){inp.readOnly=true}};
}
function mkSel(it,ex,holder){
  var s=el('select',holder?'inl':'ans');
  s.setAttribute('aria-label','Chọn đáp án câu '+it._n);
  var o0=el('option','','— chọn —');o0.value='';s.appendChild(o0);
  ex.bank.forEach(function(b,i){var o=el('option','',LET[i]+'. '+b);o.value=b;s.appendChild(o)});
  s.addEventListener('change',progress);
  return s;
}
function mkOrder(it,card){
  var picked=[],out=el('div','out'),pool=el('div','pool'),chips=[];
  var build=el('div','build');
  function draw(){
    out.innerHTML='';
    if(!picked.length)out.appendChild(el('span','ph','Bấm vào các từ bên dưới theo đúng thứ tự…'));
    picked.forEach(function(i,pos){
      var c=el('button','chip',it.tk[i].h);c.type='button';c.setAttribute('aria-label','Bỏ từ '+it.tk[i].v);
      c.addEventListener('click',function(){if(submitted)return;picked.splice(pos,1);draw();progress()});
      out.appendChild(c);
    });
    chips.forEach(function(c,i){c.classList.toggle('used',picked.indexOf(i)>-1)});
  }
  it.tk.forEach(function(t,i){
    var c=el('button','chip',t.h);c.type='button';
    c.addEventListener('click',function(){if(submitted)return;if(picked.indexOf(i)<0){picked.push(i);draw();progress()}});
    chips.push(c);pool.appendChild(c);
  });
  var clr=el('button','mini','↺ Xoá làm lại');clr.type='button';
  clr.addEventListener('click',function(){if(submitted)return;picked=[];draw();progress()});
  build.appendChild(out);build.appendChild(pool);build.appendChild(clr);card.appendChild(build);
  draw();
  return {get:function(){return picked.map(function(i){return it.tk[i].v}).join('')},empty:function(){return !picked.length}};
}

/* ---------- grading ---------- */
function gradeRules(it,raw){
  var u=norm(raw),miss=[];
  var han=(raw.match(/[一-鿿]/g)||[]).length;
  if(!u||han<Math.max(1,Math.floor(u.length*0.7))) return {ok:false,miss:['phải viết bằng chữ Hán']};
  var i;
  if(it.ok){for(i=0;i<it.ok.length;i++){if(norm(it.ok[i])===u)return {ok:true}}}
  if(!it.need||!it.need.length) return {ok:false,miss:['câu chưa khớp với đáp án mẫu']};
  if(it.min&&han<it.min)miss.push('viết đủ ít nhất '+it.min+' chữ Hán (hiện có '+han+')');
  it.need.forEach(function(n){var re;try{re=new RegExp(n.re)}catch(e){return}if(!re.test(u))miss.push(n.label)});
  (it.no||[]).forEach(function(n){var re;try{re=new RegExp(n.re)}catch(e){return}if(re.test(u))miss.push(n.label)});
  return {ok:miss.length===0,miss:miss};
}
function gradeItem(r){
  var it=r.it,g=r.h,res={ok:false,you:'',key:'',keyVi:false,youVi:false,extra:''};
  var t=it.t;
  if(t==='mcq'){
    var v=g.get();res.ok=(v===it.a);
    res.you=v===null?'(chưa trả lời)':LET[v]+'. '+it.o[v];res.key=LET[it.a]+'. '+it.o[it.a];res.youVi=res.keyVi=!!it.lo;
    g.mark(it.a);
  }else if(t==='tf'){
    var v2=g.get();res.ok=(v2===it.a);
    res.you=v2===null?'(chưa trả lời)':(v2?'Đúng':'Sai');res.key=it.a?'Đúng':'Sai';res.youVi=res.keyVi=true;
    g.mark(it.a);
  }else if(t==='type'){
    var raw=g.get(),u=norm(raw);
    res.ok=it.a.some(function(a){return norm(a)===u});
    res.you=raw.trim()||'(chưa trả lời)';res.key=it.a[0];res.youVi=!raw.trim();
  }else if(t==='bank'){
    var s=g.get();res.ok=(s===it.a);
    res.you=s||'(chưa trả lời)';res.key=it.a;res.youVi=!s||!!r.ex.bankVi;res.keyVi=!!r.ex.bankVi;
  }else if(t==='order'){
    var o=g.get();res.ok=it.acc.some(function(a){return norm(a)===norm(o)});
    res.you=o||'(chưa trả lời)';res.key=it.acc[0];res.youVi=!o;
  }else if(t==='write'||t==='para'){
    var w=g.get();var gr=gradeRules(it,w);res.ok=gr.ok;
    res.you=w.trim()||'(chưa trả lời)';res.key=it.model||'';res.youVi=!w.trim();
    if(!gr.ok&&w.trim())res.extra='Câu trả lời của bạn còn thiếu / chưa đạt: <b>'+gr.miss.map(esc).join('; ')+'</b>.';
  }
  return res;
}

/* ---------- build page ---------- */
function build(){
  ALL=[];submitted=false;app.innerHTML='';var ss=document.getElementById('sideSubmit');if(ss)ss.style.display='';
  document.body.classList.remove('locked');
  var N=0;
  var hero=el('section','hero');
  hero.innerHTML=D.scene+'<div class="txt"><span class="tag">HSK 2 · BÀI '+D.no+'</span><h1>'+D.titleHtml+'</h1><p>'+esc(D.titleVi)+'</p><div class="meta">'+
   '<span>96 câu</span><span>Trắc nghiệm · Điền từ · Sắp xếp câu · Viết câu · Viết đoạn</span></div></div>';
  app.appendChild(hero);
  app.appendChild(el('div','guide','<b>Cách làm:</b> làm hết các phần rồi bấm <b>“Nộp bài”</b> ở cuối trang. Trắc nghiệm chấm đúng/sai tuyệt đối. Câu viết được chấm theo ý và ngữ pháp: nếu bạn dùng từ hay cấu trúc hơi khác mà người Trung Quốc vẫn nói tự nhiên thì vẫn tính đúng. Sau khi nộp sẽ có phần giải thích từng câu sai.'));

  D.sections.forEach(function(sec){
    var S=el('section','sec');
    S.id='sec'+sec.num;S.appendChild(el('div','sec-h','<div class="seal">'+sec.num+'</div><h2>'+sec.title+'<small>'+String(sec.sub).replace(/([\u4e00-\u9fff]+)/g,'<span class="hh">$1</span>')+'</small></h2>'));
    sec.exercises.forEach(function(ex){
      var X=el('div','ex');X.id='ex'+ex.no;
      X.appendChild(el('div','ex-h','<span class="no">Bài '+ex.no+'</span><div class="ins">'+ex.ins+(ex.insVi?'<small>'+ex.insVi+'</small>':'')+'</div>'));
      if(ex.bank&&!ex.hideBank){
        var bk=el('div','bank');
        ex.bank.forEach(function(b,i){bk.appendChild(el('span','','<b>'+LET[i]+'</b>'+(ex.bankVi?'<span style="font-family:var(--lat);font-size:1rem;background:none;border:0;padding:0">'+esc(b)+'</span>':(ex.bankH?ex.bankH[i]:esc(b)))))});
        X.appendChild(bk);
      }
      var pass=null,passTxt=ex.passage;
      if(passTxt){pass=el('div','passage');X.appendChild(pass);}
      var holders={};
      ex.items.forEach(function(it,idx){
        N++;it._n=N;
        var card=el('div','card');card.id='q'+N;
        var rec={it:it,ex:ex,sec:sec,n:N,card:card,h:null};
        var qhtml=it.q||'';
        var inlineSel=(it.t==='bank'&&(passTxt||/____/.test(qhtml)));
        if(it.t==='bank'&&!passTxt&&/____/.test(qhtml)){
          var s=mkSel(it,ex,true);
          var head=el('div','qt hz','<span class="qn">'+N+'</span>');
          var parts=qhtml.split('____');
          head.insertAdjacentHTML('beforeend',parts[0]);head.appendChild(s);head.insertAdjacentHTML('beforeend',parts[1]||'');
          card.appendChild(head);
          rec.h={get:function(){return s.value},empty:function(){return !s.value}};
        }else if(it.t==='bank'&&passTxt){
          var s2=mkSel(it,ex,true);holders[it.slot||(idx+1)]=s2;
          card.appendChild(el('div','qt','<span class="qn">'+N+'</span> Chỗ trống <b>('+(it.slot||(idx+1))+')</b>'+(it.q?' — '+it.q:'')));
          card.appendChild(el('div','hint','Chọn từ điền vào chỗ trống ('+(it.slot||(idx+1))+') trong đoạn văn phía trên.'));
          rec.h={get:function(){return s2.value},empty:function(){return !s2.value}};
          card.dataset.passage='1';
        }else{
          var isHz=(it.hz!==false)&&(it.t!=='tf'||it.hz);
          card.appendChild(el('div','qt'+(it.vq?' vq':' hz'),'<span class="qn">'+N+'</span>'+qhtml));
          if(it.t==='bank'){var s3=mkSel(it,ex,false);card.appendChild(s3);rec.h={get:function(){return s3.value},empty:function(){return !s3.value}}}
          else if(it.t==='mcq')rec.h=mkMcq(it,card);
          else if(it.t==='tf')rec.h=mkTf(it,card);
          else if(it.t==='type')rec.h=mkText(it,card,false);
          else if(it.t==='write'){rec.h=mkText(it,card,false);}
          else if(it.t==='para'){rec.h=mkText(it,card,true);}
          else if(it.t==='order')rec.h=mkOrder(it,card);
          if(it.hint)card.appendChild(el('div','hint','<b>Gợi ý:</b> '+it.hint));
          if(it.t==='para'&&it.need){card.appendChild(el('div','reqs',it.need.map(function(n){return '<span>'+esc(n.label)+'</span>'}).join('')))}
        }
        X.appendChild(card);ALL.push(rec);
      });
      if(pass){
        pass.innerHTML=ex.passage.replace(/\{(\d+)\}/g,'<span data-slot="$1"></span>');
        [].forEach.call(pass.querySelectorAll('[data-slot]'),function(sp){
          var h=holders[sp.dataset.slot];if(h)sp.replaceWith(h);
        });
        pass.className='passage hz';
      }
      S.appendChild(X);
    });
    app.appendChild(S);
  });

  var sub=el('div','submit');
  sub.innerHTML='<div class="warn" id="warn" role="alert"></div><button type="button" class="btn pri" id="subBtn">Nộp bài</button>';
  app.appendChild(sub);
  var res=el('section','result');res.id='result';app.appendChild(res);
  document.getElementById('subBtn').addEventListener('click',onSubmit);
  buildNav();progress();
}

function buildNav(){
  var nav=document.getElementById('sideNav'),tabs=document.getElementById('tabs');
  nav.innerHTML='<h4>Mục lục</h4>';tabs.innerHTML='';
  D.sections.forEach(function(sec){
    var short=String(sec.sub).split('·')[0].trim();
    var g=el('div','sg');
    g.appendChild(el('a','', '<span class="n">'+sec.num+'</span><span>'+sec.title+'</span><span class="c" data-sc="'+sec.num+'"></span>'));
    g.firstChild.href='#sec'+sec.num;
    var ls=el('div','ls');
    sec.exercises.forEach(function(ex){var a=el('a','','Bài '+ex.no+' <span style="margin-left:auto;font-size:.76rem;color:var(--ink-2)">'+ex.items.length+' câu</span>');a.href='#ex'+ex.no;a.dataset.ex=ex.no;ls.appendChild(a)});
    g.appendChild(ls);nav.appendChild(g);
    var tb=el('button','tab','<span class="h">'+sec.num+'</span><span class="t">'+(({'一':'Từ vựng','二':'Ngữ pháp','三':'Bài khoá','四':'Viết'})[sec.num]||esc(sec.title))+'</span>');tb.type='button';tb.dataset.sec=sec.num;
    tb.addEventListener('click',function(){var s=document.getElementById('sec'+sec.num);if(s)s.scrollIntoView({behavior:'smooth',block:'start'})});
    tabs.appendChild(tb);
  });
  var sb=document.getElementById('sideSubmit');sb.onclick=onSubmit;
  nav.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;e.preventDefault();var s=document.querySelector(a.getAttribute('href'));if(s)s.scrollIntoView({behavior:'smooth',block:'start'})});
}
function spy(){
  var secs=[].slice.call(document.querySelectorAll('.sec')),cur=null,exs=[].slice.call(document.querySelectorAll('.ex')),ce=null;
  secs.forEach(function(s){if(s.getBoundingClientRect().top<140)cur=s.id.slice(3)});
  exs.forEach(function(s){if(s.getBoundingClientRect().top<160)ce=s.id.slice(2)});
  if(!cur&&secs[0])cur=secs[0].id.slice(3);
  [].forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-current',b.dataset.sec===cur)});
  [].forEach.call(document.querySelectorAll('.sg .ls a'),function(a){a.setAttribute('aria-current',a.dataset.ex===ce)});
}
window.addEventListener('scroll',spy,{passive:true});
function progress(){
  var bs={},bd={};ALL.forEach(function(r){var k=r.sec.num;bs[k]=(bs[k]||0)+1;if(!r.h.empty())bd[k]=(bd[k]||0)+1});
  [].forEach.call(document.querySelectorAll('[data-sc]'),function(c){c.textContent=(bd[c.dataset.sc]||0)+'/'+(bs[c.dataset.sc]||0)});
  var exd={};ALL.forEach(function(r){var k=r.ex.no;exd[k]=exd[k]||{n:0,d:0};exd[k].n++;if(!r.h.empty())exd[k].d++});
  [].forEach.call(document.querySelectorAll('.sg .ls a'),function(a){var x=exd[a.dataset.ex];a.classList.toggle('done',!!x&&x.d===x.n)});
  spy();
  var done=ALL.filter(function(r){return !r.h.empty()}).length;
  document.getElementById('progFill').style.width=(ALL.length?done/ALL.length*100:0)+'%';
  document.getElementById('progTxt').textContent=done+' / '+ALL.length+' câu';
}

function onSubmit(){
  if(submitted)return;
  var left=ALL.filter(function(r){return r.h.empty()}).length;
  var w=document.getElementById('warn');
  if(left>0&&!w.dataset.ok){
    w.innerHTML='Bạn còn <b>'+left+'</b> câu chưa làm (sẽ tính là sai). Bấm “Nộp bài” lần nữa để nộp luôn, hoặc kéo lên làm tiếp.';
    w.classList.add('on');w.dataset.ok='1';w.scrollIntoView({block:'center',behavior:'smooth'});return;
  }
  doSubmit();
}

function doSubmit(){
  submitted=true;
  document.body.classList.add('locked');
  var w=document.getElementById('warn');w.classList.remove('on');
  document.getElementById('subBtn').style.display='none';document.getElementById('sideSubmit').style.display='none';
  var right=0,wrong=[],bySec={};
  ALL.forEach(function(r){
    var g=gradeItem(r);r.res=g;
    if(r.h.lock)r.h.lock();
    [].forEach.call(r.card.querySelectorAll('select,input,textarea'),function(x){x.disabled=true});
    var sk=r.sec.num;bySec[sk]=bySec[sk]||{t:r.sec.title,ok:0,n:0};bySec[sk].n++;
    r.card.classList.add(g.ok?'ok':'no');
    var bd=el('div','badge '+(g.ok?'ok':'no'),g.ok?'✓ Đúng':'✗ Sai <a href="#w'+r.n+'">xem giải đáp</a>');
    r.card.appendChild(bd);
    if(g.ok){right++;bySec[sk].ok++}else wrong.push(r);
  });
  var total=ALL.length,pct=Math.round(right/total*100);
  var msg=pct>=90?'Xuất sắc! Bạn nắm bài rất chắc.':pct>=70?'Khá tốt! Xem lại các câu sai bên dưới nhé.':pct>=50?'Tạm ổn, hãy đọc kỹ phần giải đáp rồi làm lại.':'Cần ôn lại bài. Đọc phần giải đáp và phần tóm tắt kiến thức bên dưới rồi làm lại nhé.';
  var R=document.getElementById('result');R.classList.add('on');
  var h='<div class="score"><h2>Kết quả bài '+D.no+'</h2><div class="stats">'+
   '<div class="stat g"><b>'+right+'</b><span>✓ Câu đúng</span></div>'+
   '<div class="stat r"><b>'+wrong.length+'</b><span>✗ Câu sai</span></div>'+
   '<div class="stat n"><b>'+pct+'%</b><span>'+right+' / '+total+' câu</span></div></div><p><b>'+msg+'</b></p><div class="secs">';
  Object.keys(bySec).forEach(function(k){var s=bySec[k];h+='<div class="secrow"><span>'+k+'、'+esc(s.t)+'</span><div class="tr"><div class="fl" style="width:'+Math.round(s.ok/s.n*100)+'%"></div></div><span>'+s.ok+' / '+s.n+'</span></div>'});
  h+='</div><div style="margin-top:14px"><button type="button" class="btn sec" id="redo">↺ Làm lại bài này</button></div></div>';
  h+='<div class="explain"><h3>Giải đáp các câu sai ('+wrong.length+')</h3>';
  if(!wrong.length)h+='<div class="allright">✓ Bạn làm đúng toàn bộ! Không có câu nào cần sửa.</div>';
  wrong.forEach(function(r){
    var g=r.res,it=r.it;
    var q=it.t==='bank'&&r.ex.passage?('Chỗ trống ('+(it.slot||'')+') trong đoạn văn của '+esc(r.ex.insPlain||('Bài '+r.ex.no))):(it.q||'').replace(/____/g,'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    var why=it.why||'';
    h+='<div class="wr" id="w'+r.n+'"><div class="hd">Câu '+r.n+' <small>· '+r.sec.num+'、'+esc(r.sec.title)+' · Bài '+r.ex.no+'</small></div>'+
      '<div class="qq'+(it.vq?' vq':' hz')+'">'+q+'</div>'+
      '<div class="you"><b class="lb">Bạn trả lời</b><div class="v'+(g.youVi?' vi':'')+'">'+(g.you.indexOf('(chưa')===0?esc(g.you):(it.t==='mcq'||it.t==='bank'&&!r.ex.bankVi?g.you:esc(g.you)))+'</div></div>'+
      '<div class="key"><b class="lb">Đáp án đúng'+((it.t==='write'||it.t==='para')?' (câu mẫu)':'')+'</b><div class="v'+(g.keyVi?' vi':'')+'">'+(it.keyH||g.key)+'</div></div>'+
      '<div class="why"><b class="lb">Vì sao sai / ghi nhớ</b>'+(g.extra?g.extra+'<br>':'')+why+'</div></div>';
  });
  h+='</div>';
  if(D.review)h+='<div class="review"><h3>Tóm tắt kiến thức bài '+D.no+' để ôn lại</h3>'+D.review+'</div>';
  R.innerHTML=h;
  document.getElementById('redo').addEventListener('click',function(){build();window.scrollTo({top:0,behavior:'smooth'})});
  R.scrollIntoView({behavior:'smooth',block:'start'});
}
build();
})();
</script>
