<!doctype html>
<html lang="vi" data-lesson="04">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 2 – Bài 4: Bạn mặc màu đỏ rất đẹp</title>
<style>
@font-face{font-family:"LatTNR";src:local("Times New Roman"),local("TimesNewRomanPSMT"),local("Liberation Serif"),local("Tinos");unicode-range:U+0020-007E,U+00A0-024F,U+1E00-1EFF}
@font-face{font-family:"LatTNR";font-weight:700;src:local("Times New Roman Bold"),local("TimesNewRomanPS-BoldMT"),local("Liberation Serif Bold"),local("Tinos Bold");unicode-range:U+0020-007E,U+00A0-024F,U+1E00-1EFF}
:root{
  --vermilion:#2F6B52; --vermilion-d:#1F4D3A; --vermilion-l:#E3F0E0;
  --gold:#C49A3A; --gold-l:#F8EDC6; --paper:#F4F7E6; --card:#FFFEF7; --mint:#DCEBD8;
  --ink:#1F2E27; --ink-2:#44574B; --line:#CFDDBF;
  --ok:#1D7A4A; --ok-l:#E0F3E6; --bad:#B3261E; --bad-l:#FDE8E6; --sel:#FFF1C9; --hdr:#F8EDC6;
  --k:1;
  --han:"LatTNR","Kaiti SC","STKaiti","Kaiti TC","KaiTi","KaiTi_GB2312","楷体","DFKai-SB","AR PL UKai CN","Noto Serif CJK SC",serif;
  --lat:"Times New Roman",Times,"Liberation Serif","Tinos","Nimbus Roman",serif;
}
*{box-sizing:border-box}
html{font-size:calc(17px * var(--k));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--lat);line-height:1.6;
  background-image:linear-gradient(180deg,var(--paper) 0,var(--paper) 60%,var(--mint) 100%);background-attachment:fixed}
.han,.q-han{font-family:var(--han)}
ruby{ruby-position:over;ruby-align:center;font-family:var(--han)}
.vq ruby,.opt .t.vi ruby,.wr .v.vi ruby{font-size:1.15em}
rt{font-family:var(--lat);font-size:.52em;font-weight:500;color:var(--vermilion-d);letter-spacing:.01em;line-height:1.1}
body.pm-off rt{display:none}
body.pm-hard ruby.e rt{display:none}
.hz{font-family:var(--han);font-size:1.3em;line-height:2.05}
.hz ruby{margin:0 .02em}
body.pm-off .hz{line-height:1.7}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 120px}

/* top nav + shell */
.topnav{position:sticky;top:10px;z-index:30;max-width:1280px;margin:10px auto 0;width:calc(100% - 24px);background:rgba(255,254,247,.94);backdrop-filter:blur(8px);border:2px solid var(--gold);border-radius:999px;box-shadow:0 8px 22px rgba(47,107,82,.14);display:flex;align-items:center;gap:12px;padding:6px 10px 6px 8px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.logo .mk{width:42px;height:42px;border-radius:50%;background:var(--vermilion);color:#fff;font-family:var(--han);font-size:1.4rem;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--card),0 0 0 2px var(--gold)}
.logo b{display:block;font-size:1rem;line-height:1.15;color:var(--vermilion-d)}
.logo small{display:block;font-size:.78rem;color:var(--ink-2);font-weight:700;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.tabs{flex:1 1 0;min-width:0;display:flex;gap:8px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:3px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 16px;min-height:40px;font-size:.95rem;font-weight:700;color:var(--vermilion-d);display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(47,107,82,.12)}
.tab .h{font-family:var(--han);font-size:1.2rem;font-weight:400}
.tab[aria-current=true]{background:var(--vermilion);border-color:var(--vermilion);color:#fff;box-shadow:0 3px 0 var(--vermilion-d)}
.ctl{display:flex;gap:8px;flex:none;align-items:center}
.seg{display:inline-flex;border:2px solid var(--vermilion);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:3px 11px;min-height:36px;font-size:.88rem;font-weight:700;color:var(--vermilion-d)}
.seg button[aria-pressed=true]{background:var(--vermilion);color:#fff}
.shell{max-width:1280px;margin:16px auto 80px;width:calc(100% - 24px);display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
#sideNav{max-height:calc(100vh - 250px);overflow:auto}
.sc{background:rgba(255,254,247,.96);border:2px solid var(--line);border-radius:24px;padding:12px 12px;box-shadow:0 6px 18px rgba(47,107,82,.08)}
.sc h4{margin:0 0 6px;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.sg{margin-bottom:6px}
.sg>a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--vermilion-d);font-weight:700;font-size:.98rem;padding:3px 6px;border-radius:12px}
.sg>a .n{width:30px;height:30px;border-radius:50%;background:var(--vermilion);color:#fff;font-family:var(--han);font-size:1.05rem;display:flex;align-items:center;justify-content:center;flex:none}
.sg>a .c{margin-left:auto;font-size:.78rem;color:var(--ink-2)}
.sg .ls a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:.92rem;font-weight:600;padding:5px 10px 5px 14px;margin:2px 0 2px 14px;border-radius:12px;border:2px solid transparent}
.sg .ls a:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.sg .ls a:hover{background:var(--mint)}
.sg .ls a[aria-current=true]{background:var(--mint);border-color:var(--vermilion);color:var(--vermilion-d)}
.sg .ls a.done:before{background:var(--ok)}
.sprog .row{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:var(--ink-2);margin-top:6px}
.sbtn{width:100%;margin-top:10px;border:0;border-radius:14px;background:var(--vermilion);color:#fff;font-weight:800;font-size:1rem;min-height:44px;box-shadow:0 4px 0 var(--vermilion-d)}
.sbtn:active{transform:translateY(2px)}
.wrap.mainc{max-width:none;margin:0;background:rgba(255,254,247,.97);border:2px solid var(--line);border-radius:30px;padding:20px 26px 40px;box-shadow:0 10px 30px rgba(47,107,82,.1);min-width:0}
.lab{font-size:.8rem;font-weight:700;color:var(--ink-2);display:block;margin-bottom:2px}
.prog .tr{height:10px;background:#D9E6CC;border-radius:6px;overflow:hidden}
.prog .fl{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--vermilion));transition:width .25s ease-out}
.prog small{font-size:.82rem;font-weight:700;color:var(--ink-2)}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .logo small{display:none}
  .tab .t{display:none}
}
@media (max-width:640px){
  .topnav{border-radius:22px;flex-wrap:wrap;gap:6px 8px;top:6px;padding:6px 8px}
  .logo b{font-size:.9rem}
  .tabs{order:3;flex:1 1 100%;justify-content:flex-start}
  .tab .t{display:inline}
  .tab{padding:2px 12px;min-height:36px;font-size:.85rem}
  .ctl{margin-left:auto}
  .seg button{min-height:34px;padding:2px 8px;font-size:.8rem}
  .wrap.mainc{padding:14px 12px 30px;border-radius:22px}
}
/* hero */
.hero{margin:18px 0 10px;border:2px solid var(--gold);border-radius:22px;background:var(--card);color:var(--ink);position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(47,107,82,.12)}
.hero .scene{display:block;width:100%;height:auto;aspect-ratio:800/265}
@media (max-width:640px){.hero .scene{aspect-ratio:800/340}}
.hero .txt{padding:14px 22px 18px;background:linear-gradient(180deg,#FFFEF7,var(--hdr));border-top:3px double var(--gold);position:relative}
.hero .tag{display:inline-block;background:var(--vermilion);color:#fff;font-weight:700;font-size:.8rem;padding:2px 14px;border-radius:99px;letter-spacing:.06em}
.hero h1{margin:2px 0 0;font-family:var(--han);font-size:2.3rem;line-height:1.9;font-weight:400;color:var(--vermilion-d)}
.hero h1 rt{color:var(--vermilion)}
.hero p{margin:0;font-size:1.05rem;font-weight:700;color:var(--ink-2)}
.hero .meta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{background:var(--mint);border:1px solid #B9D3BE;border-radius:99px;padding:1px 12px;font-size:.85rem;font-weight:700;color:var(--vermilion-d)}
.guide{margin:12px 0;padding:10px 14px;background:var(--gold-l);border-left:6px solid var(--gold);border-radius:10px;font-size:.95rem}
.guide b{color:var(--vermilion-d)}

/* section */
.sec{margin-top:34px}
.sec-h{display:flex;align-items:center;gap:12px;border-bottom:3px double var(--gold);padding-bottom:6px;margin-bottom:8px}
.sec-h .seal{background:var(--vermilion);color:#fff;font-family:var(--han);font-size:1.6rem;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px var(--card),0 0 0 3px var(--gold);flex:none}
.sec-h h2{margin:0;font-family:var(--han);font-weight:400;font-size:1.55rem;line-height:1.4;color:var(--vermilion-d)}
.sec-h h2 small{display:block;font-family:var(--lat);font-size:.9rem;font-weight:700;color:var(--ink-2);line-height:1.3}
.ex{margin:18px 0 8px}
.ex-h{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px}
.ex-h .no{flex:none;background:var(--gold);color:#fff;font-weight:800;border-radius:8px;padding:2px 10px;font-size:.95rem;margin-top:6px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.ex-h .ins{flex:1 1 0;min-width:0;overflow-wrap:anywhere;font-family:var(--han);font-weight:400;font-size:1.3rem;line-height:2;color:var(--vermilion-d)}
.ex-h .ins small{display:block;font-family:var(--lat);font-weight:700;color:var(--ink-2);font-size:.9rem;line-height:1.35}
.ex-h .ins small ruby,.ex-h .ins small rt{font-size:inherit}
.hh{font-family:var(--han);font-weight:400;font-size:1.2rem;line-height:1.3;color:var(--vermilion-d)}
.vnote{display:block;font-family:var(--lat);font-size:.62em;line-height:1.3;color:var(--ink-2);font-weight:600}
.passage{background:#fff;border:2px dashed var(--gold);border-radius:14px;padding:12px 18px;margin:8px 0 12px}
.passage .hz{font-size:1.3em}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.bank span{background:var(--gold-l);border:2px solid var(--gold);border-radius:10px;padding:2px 12px;font-family:var(--han);font-size:1.25rem;line-height:1.9}
.bank span b{font-family:var(--lat);color:var(--vermilion-d);margin-right:6px;font-size:.85rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0;position:relative;scroll-margin-top:96px}
.card .qn{display:inline-block;background:var(--vermilion);color:#fff;font-weight:800;border-radius:7px;font-size:.78rem;padding:1px 9px;margin-right:8px;vertical-align:middle}
.card .qt{font-size:1.08rem;font-weight:600}
.card .qt.hz{font-weight:400}
.card .qt .blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink-2);margin:0 4px}
.opts{display:grid;gap:8px;margin-top:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 12px;min-height:48px;font-size:1.05rem;color:var(--ink)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold-l);color:var(--vermilion-d);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-family:var(--lat)}
.opt .t{font-family:var(--han);font-size:1.2rem;line-height:1.9}
.opt .t.vi{font-family:var(--lat);font-size:1.05rem;line-height:1.4}
.opt:hover{border-color:var(--gold);background:#FBFAEA}
.opt[aria-pressed=true]{border-color:var(--vermilion);background:var(--sel);box-shadow:0 0 0 2px var(--vermilion) inset}
.opt[aria-pressed=true] .l{background:var(--vermilion);color:#fff}
input.ans,textarea.ans,select.ans{width:100%;font-family:var(--han);font-size:1.3rem;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:8px;min-height:52px}
textarea.ans{line-height:1.8;resize:vertical;min-height:140px}
input.ans:focus,textarea.ans:focus,select.ans:focus{border-color:var(--vermilion);outline:none;box-shadow:0 0 0 3px rgba(47,107,82,.25)}
select.inl{font-family:var(--han);font-size:1.15rem;padding:2px 8px;border:2px solid var(--vermilion);border-radius:10px;background:#fff;color:var(--ink);min-height:44px;max-width:100%;margin:2px 4px}
select.ans{font-family:var(--lat);font-size:1.05rem;width:auto;min-width:220px;max-width:100%}
.hint{margin-top:6px;font-size:.88rem;color:var(--ink-2)}
.hint b{color:var(--vermilion-d)}
.reqs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reqs span{background:var(--vermilion-l);border:1px solid #B9D3BE;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:600;color:var(--vermilion-d)}
.build{margin-top:8px}
.build .out{min-height:62px;border:2px dashed var(--gold);background:#fff;border-radius:12px;padding:4px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.build .pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:2px solid var(--gold);background:var(--gold-l);border-radius:10px;padding:0 12px;min-height:44px;font-family:var(--han);font-size:1.2rem;line-height:1.9;color:var(--ink)}
.chip:hover{background:#FFF1C9}
.chip.used{opacity:.25;pointer-events:none}
.out .chip{background:var(--sel);border-color:var(--vermilion)}
.mini{border:2px solid var(--line);background:#fff;border-radius:10px;font-size:.8rem;font-weight:700;padding:4px 12px;margin-top:8px;min-height:40px;color:var(--ink-2)}
.ph{color:#8C9A86;font-size:.85rem}

/* states after submit */
.card.ok{border-color:var(--ok);background:var(--ok-l)}
.card.no{border-color:var(--bad);background:var(--bad-l)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.82rem;border-radius:99px;padding:2px 12px;margin-top:8px}
.badge.ok{background:var(--ok);color:#fff}
.badge.no{background:var(--bad);color:#fff}
.badge a{color:#fff;text-decoration:underline;margin-left:6px}
.opt.right{border-color:var(--ok);background:#D6F0E0}
.opt.wrong{border-color:var(--bad);background:#FAD4D0}
.locked .opt,.locked .chip{pointer-events:none}

/* submit */
.submit{margin:34px 0 10px;text-align:center}
.btn{border:0;border-radius:14px;padding:14px 34px;font-size:1.1rem;font-weight:800;min-height:54px}
.btn.pri{background:var(--vermilion);color:#fff;box-shadow:0 5px 0 var(--vermilion-d)}
.btn.pri:hover{background:#3B7F63}
.btn.pri:active{transform:translateY(3px);box-shadow:0 2px 0 var(--vermilion-d)}
.btn.sec{background:#fff;border:2px solid var(--vermilion);color:var(--vermilion-d);margin:4px}
.warn{display:none;margin:14px auto;max-width:560px;background:var(--gold-l);border:2px solid var(--gold);border-radius:14px;padding:12px 16px;font-weight:600}
.warn.on{display:block}

/* result */
.result{margin-top:30px;display:none}
.result.on{display:block}
.score{border:3px solid var(--vermilion);border-radius:20px;background:#fff;padding:20px;text-align:center}
.score h2{margin:0 0 6px;color:var(--vermilion-d)}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.stat{min-width:110px;border-radius:14px;padding:8px 14px;border:2px solid var(--line)}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{font-size:.82rem;font-weight:700}
.stat.g{border-color:var(--ok);color:var(--ok);background:var(--ok-l)}
.stat.r{border-color:var(--bad);color:var(--bad);background:var(--bad-l)}
.stat.n{border-color:var(--gold);color:var(--vermilion-d);background:var(--gold-l)}
.secs{display:grid;gap:6px;margin-top:10px;text-align:left}
.secrow{display:grid;grid-template-columns:minmax(120px,210px) 1fr 64px;gap:10px;align-items:center;font-size:.85rem;font-weight:600}
.secrow .tr{height:12px;background:#D9E6CC;border-radius:7px;overflow:hidden}
.secrow .fl{height:100%;background:var(--ok)}
.explain{margin-top:26px}
.explain h3{color:var(--vermilion-d);border-bottom:3px double var(--gold);padding-bottom:4px}
.wr{background:#fff;border:2px solid var(--bad);border-left-width:8px;border-radius:14px;padding:12px 16px;margin:12px 0}
.wr .hd{font-weight:800;color:var(--bad);font-size:.9rem}
.wr .hd small{color:var(--ink-2);font-weight:600}
.wr .qq{margin:6px 0;font-weight:600}
.wr .qq.hz{font-weight:400}
.wr .you,.wr .key,.wr .why{border-radius:10px;padding:6px 12px;margin-top:6px;font-size:.95rem}
.wr .you{background:var(--bad-l)}
.wr .key{background:var(--ok-l)}
.wr .why{background:var(--gold-l);border:1px dashed var(--gold)}
.wr .lb{display:block;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;font-weight:800}
.wr .you .v,.wr .key .v{font-family:var(--han);font-size:1.2rem;line-height:2}
.wr .you .v.vi,.wr .key .v.vi{font-family:var(--lat);font-size:1.05rem;line-height:1.5}
.allright{background:var(--ok-l);border:2px solid var(--ok);border-radius:14px;padding:14px 18px;font-weight:700;color:var(--ok)}
.review{margin-top:26px}
.review h3{color:var(--vermilion-d);border-bottom:3px double var(--gold);padding-bottom:4px}
table.vt{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
table.vt th,table.vt td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.vt th{background:var(--vermilion);color:#fff;font-size:.8rem}
table.vt td.h{font-family:var(--han);font-size:1.25rem;line-height:2.1}
table.vt td.p{font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.gp{background:#fff;border:2px solid var(--line);border-left:8px solid var(--gold);border-radius:12px;padding:10px 16px;margin:10px 0}
.gp h4{margin:0 0 4px;color:var(--vermilion-d)}
.gp .eg{font-family:var(--han);font-size:1.2rem;line-height:2.1}
.dlg{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 16px;margin:10px 0}
.dlg h4{margin:6px 0 0;color:var(--vermilion-d)}
.dlg .ln{display:flex;gap:10px;align-items:baseline}
.dlg .who{flex:none;font-size:.75rem;font-weight:800;color:var(--gold);min-width:64px}
.dlg .tx{font-family:var(--han);font-size:1.2rem;line-height:2.1}
footer{margin-top:40px;text-align:center;font-size:.78rem;color:var(--ink-2)}
@media (max-width:560px){
  html{font-size:calc(16px * var(--k))}
  .hero h1{font-size:1.7rem}
  .ex-h .ins{font-size:1.15rem}
  .sec-h h2{font-size:1.3rem}
  .secrow{grid-template-columns:1fr 64px}.secrow .tr{grid-column:1/-1;order:3}
  .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.bar,.submit{display:none}}
</style>

<body class="pm-hard">
<header class="topnav">
  <div class="logo"><div class="mk">汉</div><div><b id="barTitle">HSK 2</b><small id="barSub"></small></div></div>
  <nav class="tabs" id="tabs" aria-label="Các phần của bài"></nav>
  <div class="ctl">
    <div class="seg" role="group" aria-label="Phiên âm" id="pmSeg">
      <button type="button" data-m="pm-off" aria-pressed="false">Ẩn</button>
      <button type="button" data-m="pm-hard" aria-pressed="true">Pinyin</button>
      <button type="button" data-m="pm-all" aria-pressed="false">Tất cả</button>
    </div>
    <div class="seg" role="group" aria-label="Cỡ chữ" id="fsSeg">

/rt>\u003c/ruby>\u003c/td>\u003ctd class=\"p\">yánsè\u003c/td>\u003ctd class=\"p\">n.\u003c/td>\u003ctd>màu sắc\u003c/td>\u003c/tr>\u003c/table>\u003ch4 style=\"margin:16px 0 4px;color:var(--vermilion-d)\">Ngữ pháp trọng điểm\u003c/h4>\u003cdiv class=\"gp\">\u003ch4>\u003cruby>动态\u003crt>dòngtài\u003c/rt>\u003c/ruby>\u003cruby>助词\u003crt>zhùcí\u003c/rt>\u003c/ruby>“\u003cruby>过\u003crt>guò\u003c/rt>\u003c/ruby>” – Trợ từ động thái “\u003cruby>过\u003crt>guò\u003c/rt>\u003c/ruby>”\u003c/h4>\u003cdiv>Đặt sau động từ để biểu thị hành động \u003cb>đã từng xảy ra trong quá khứ\u003c/b> (kinh nghiệm), nhưng không còn kéo dài đến hiện tại. Cấu trúc: \u003cb>Chủ ngữ + V + 过 + Tân ngữ\u003c/b>. Phủ định: \u003cb>没(有) + V + 过\u003c/b>. Nghi vấn: …过…吗? / …过…没有? / V没V过…?\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">她\u003crt>tā\u003c/rt>\u003c/ruby>\u003cruby>去过\u003crt>qùguò\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">中国\u003crt>zhōngguó\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">吃\u003crt>chī\u003c/rt>\u003c/ruby>\u003cruby>过\u003crt>guò\u003c/rt>\u003c/ruby>\u003cruby>饺子\u003crt>jiǎozi\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">很\u003crt>hěn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">好吃\u003crt>hǎochī\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">她\u003crt>tā\u003c/rt>\u003c/ruby>\u003cruby>没\u003crt>méi\u003c/rt>\u003c/ruby>\u003cruby>去过\u003crt>qùguò\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">中国\u003crt>zhōngguó\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">你\u003crt>nǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看\u003crt>kàn\u003c/rt>\u003c/ruby>\u003cruby>没\u003crt>méi\u003c/rt>\u003c/ruby>\u003cruby>看过\u003crt>kànguò\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">那个\u003crt>nàge\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">电影\u003crt>diànyǐng\u003c/rt>\u003c/ruby>？\u003c/div>\u003c/div>\u003cdiv class=\"gp\">\u003ch4>\u003cruby>因果\u003crt>yīnguǒ\u003c/rt>\u003c/ruby>\u003cruby>复句\u003crt>fùjù\u003c/rt>\u003c/ruby>“\u003cruby>因为\u003crt>yīnwèi\u003c/rt>\u003c/ruby>……，\u003cruby>所以\u003crt>suǒyǐ\u003c/rt>\u003c/ruby>……” – Câu phức nhân quả\u003c/h4>\u003cdiv>“因为” nêu nguyên nhân, “所以” nêu kết quả. Có thể dùng \u003cb>cả cặp\u003c/b> hoặc \u003cb>chỉ dùng một trong hai\u003c/b>.\u003c/div>\u003cdiv class=\"eg\">\u003cruby>就是\u003crt>jiùshì\u003c/rt>\u003c/ruby>\u003cruby>因为\u003crt>yīnwèi\u003c/rt>\u003c/ruby>\u003cruby>没\u003crt>méi\u003c/rt>\u003c/ruby>\u003cruby>穿过\u003crt>chuānguò\u003c/rt>\u003c/ruby>，\u003cruby>所以\u003crt>suǒyǐ\u003c/rt>\u003c/ruby>\u003cruby>要\u003crt>yào\u003c/rt>\u003c/ruby>\u003cruby>试试\u003crt>shìshì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">啊\u003crt>a\u003c/rt>\u003c/ruby>！\u003c/div>\u003cdiv class=\"eg\">\u003cruby>因为\u003crt>yīnwèi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby>生病\u003crt>shēngbìng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">今天\u003crt>jīntiān\u003c/rt>\u003c/ruby>\u003cruby>没\u003crt>méi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">去\u003crt>qù\u003c/rt>\u003c/ruby>\u003cruby>上班\u003crt>shàngbān\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>\u003cruby>没\u003crt>méi\u003c/rt>\u003c/ruby>\u003cruby>去过\u003crt>qùguò\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">他家\u003crt>tājiā\u003c/rt>\u003c/ruby>，\u003cruby>所以\u003crt>suǒyǐ\u003c/rt>\u003c/ruby>\u003cruby>让\u003crt>ràng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">他\u003crt>tā\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">来\u003crt>lái\u003c/rt>\u003c/ruby>\u003cruby>车站\u003crt>chēzhàn\u003c/rt>\u003c/ruby>\u003cruby>接\u003crt>jiē\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">我\u003crt>wǒ\u003c/rt>\u003c/ruby>。\u003c/div>\u003c/div>\u003cdiv class=\"gp\">\u003ch4>“\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>”\u003cruby class=\"e\">字\u003crt>zì\u003c/rt>\u003c/ruby>\u003cruby>短语\u003crt>duǎnyǔ\u003c/rt>\u003c/ruby> – Cụm “\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>”\u003c/h4>\u003cdiv>“的” đặt sau danh từ, đại từ, động từ, tính từ… tạo thành cụm “的” có chức năng như một \u003cb>danh từ\u003c/b> (tỉnh lược danh từ phía sau).\u003c/div>\u003cdiv class=\"eg\">\u003cruby>红色\u003crt>hóngsè\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>、\u003cruby>绿色\u003crt>lǜsè\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>、\u003cruby>黑色\u003crt>hēisè\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">你\u003crt>nǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">想\u003crt>xiǎng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">买\u003crt>mǎi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">哪个\u003crt>nǎge\u003c/rt>\u003c/ruby>？\u003c/div>\u003cdiv class=\"eg\">\u003cruby class=\"e\">这个\u003crt>zhège\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">面包\u003crt>miànbāo\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">是\u003crt>shì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">爸爸\u003crt>bàba\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">买\u003crt>mǎi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">妈妈\u003crt>māma\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">买\u003crt>mǎi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">在\u003crt>zài\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">那儿\u003crt>nà'ér\u003c/rt>\u003c/ruby>。\u003c/div>\u003cdiv class=\"eg\">\u003cruby>这件\u003crt>zhèjiàn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">衣服\u003crt>yīfu\u003c/rt>\u003c/ruby>\u003cruby>太贵\u003crt>tàiguì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">了\u003crt>le\u003c/rt>\u003c/ruby>，\u003cruby>还是\u003crt>háishì\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">买\u003crt>mǎi\u003c/rt>\u003c/ruby>\u003cruby>那件\u003crt>nàjiàn\u003c/rt>\u003c/ruby>\u003cruby>便宜\u003crt>piányi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">吧\u003crt>ba\u003c/rt>\u003c/ruby>。\u003c/div>\u003c/div>\u003ch4 style=\"margin:16px 0 4px;color:var(--vermilion-d)\">Bài khoá\u003c/h4>\u003cdiv class=\"dlg\">\u003ch4>课文 1 – Trước cửa trung tâm thương mại\u003c/h4>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘小雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">妈妈\u003crt>māma\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">我们\u003crt>wǒmen\u003c/rt>\u003c/ruby>\u003cruby>来过\u003crt>láiguò\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">这家\u003crt>zhèjiā\u003c/rt>\u003c/ruby>\u003cruby>商场\u003crt>shāngchǎng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">吗\u003crt>ma\u003c/rt>\u003c/ruby>？\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby>没来\u003crt>méilái\u003c/rt>\u003c/ruby>\u003cruby>过\u003crt>guò\u003c/rt>\u003c/ruby>，\u003cruby class=\"e\">这是\u003crt>zhèshì\u003c/rt>\u003c/ruby>\u003cruby>新开\u003crt>xīnkāi\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">的\u003crt>de\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">刘小雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">我们\u003crt>wǒmen\u003c/rt>\u003c/ruby>\u003cruby>进去\u003crt>jìnqù\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">看看\u003crt>kànkàn\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">吧\u003crt>ba\u003c/rt>\u003c/ruby>。\u003c/span>\u003c/div>\u003cdiv class=\"ln\">\u003cspan class=\"who\">王一雪\u003c/span>\u003cspan class=\"tx\">\u003cruby class=\"e\">好\u003crt>hǎo\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">啊\u003crt>a\u003c/rt>\u003c/ruby>！\u003cruby class=\"e\">你\u003crt>nǐ\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">想\u003crt>xiǎng\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">买点儿\u003crt>mǎidiǎn'ér\u003c/rt>\u003c/ruby>\u003cruby class=\"e\">什么\u003crt>shénme\u003c/rt>\u003c/ru var PUNCT=/[\s　，。！？、；：“”‘’（）()《》…,.!?;:'"~·—\-_\[\]【】]/g;
function norm(s){return String(s||'').replace(PUNCT,'').toLowerCase()}
var LET='ABCDEFGH';
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* ---------- item builders ---------- */
function mkMcq(it,card,labelsVi){
  var wrap=el('div','opts'),val=null,btns=[];
  it.o.forEach(function(o,i){
    var b=el('button','opt','<span class="l">'+LET[i]+'</span><span class="t'+(it.lo?' vi':'')+'">'+o+'</span>');
    b.type='button';b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){ if(submitted)return; val=i;btns.forEach(function(x,j){x.setAttribute('aria-pressed',j===i)});progress()});
    btns.push(b);wrap.appendChild(b);
  });
  card.appendChild(wrap);
  return {get:function(){return val},empty:function(){return val===null},
    mark:function(key){btns.forEach(function(b,j){if(j===key)b.classList.add('right');else if(j===val)b.classList.add('wrong')})}};
}
function mkTf(it,card){
  var val=null,btns=[],wrap=el('div','opts');
  [['Đúng','✓ Đúng',true],['Sai','✗ Sai',false]].forEach(function(o,i){
    var b=el('button','opt','<span class="l">'+(i?'S':'Đ')+'</span><span class="t vi">'+o[1]+'</span>');
    b.type='button';b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){ if(submitted)return; val=o[2];btns.forEach(function(x,j){x.setAttribute('aria-pressed',j===i)});progress()});
    btns.push(b);wrap.appendChild(b);
  });
  card.appendChild(wrap);
  return {get:function(){return val},empty:function(){return val===null},
    mark:function(key){btns.forEach(function(b,j){var v=j===0;if(v===key)b.classList.add('right');else if(v===val)b.classList.add('wrong')})}};
}
function mkText(it,card,multi){
  var inp=multi?el('textarea','ans'):el('input','ans');
  if(!multi){inp.type='text'}
  inp.setAttribute('lang','zh-CN');inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','off');inp.setAttribute('spellcheck','false');
  inp.setAttribute('aria-label','Câu trả lời của câu '+it._n);
  inp.placeholder=it.ph||(multi?'Viết đoạn văn bằng chữ Hán…':'Gõ chữ Hán vào đây…');
  inp.addEventListener('input',progress);
  card.appendChild(inp);
  return {get:function(){return inp.value},empty:function(){return !inp.value.trim()},lock:function(){inp.readOnly=true}};
}
function mkSel(it,ex,holder){
  var s=el('select',holder?'inl':'ans');
  s.setAttribute('aria-label','Chọn đáp án câu '+it._n);
  var o0=el('option','','— chọn —');o0.value='';s.appendChild(o0);
  ex.bank.forEach(function(b,i){var o=el('option','',LET[i]+'. '+b);o.value=b;s.appendChild(o)});
  s.addEventListener('change',progress);
  return s;
}
function mkOrder(it,card){
  var picked=[],out=el('div','out'),pool=el('div','pool'),chips=[];
  var build=el('div','build');
  function draw(){
    out.innerHTML='';
    if(!picked.length)out.appendChild(el('span','ph','Bấm vào các từ bên dưới theo đúng thứ tự…'));
    picked.forEach(function(i,pos){
      var c=el('button','chip',it.tk[i].h);c.type='button';c.setAttribute('aria-label','Bỏ từ '+it.tk[i].v);
      c.addEventListener('click',function(){if(submitted)return;picked.splice(pos,1);draw();progress()});
      out.appendChild(c);
    });
    chips.forEach(function(c,i){c.classList.toggle('used',picked.indexOf(i)>-1)});
  }
  it.tk.forEach(function(t,i){
    var c=el('button','chip',t.h);c.type='button';
    c.addEventListener('click',function(){if(submitted)return;if(picked.indexOf(i)<0){picked.push(i);draw();progress()}});
    chips.push(c);pool.appendChild(c);
  });
  var clr=el('button','mini','↺ Xoá làm lại');clr.type='button';
  clr.addEventListener('click',function(){if(submitted)return;picked=[];draw();progress()});
  build.appendChild(out);build.appendChild(pool);build.appendChild(clr);card.appendChild(build);
  draw();
  return {get:function(){return picked.map(function(i){return it.tk[i].v}).join('')},empty:function(){return !picked.length}};
}

/* ---------- grading ---------- */
function gradeRules(it,raw){
  var u=norm(raw),miss=[];
  var han=(raw.match(/[一-鿿]/g)||[]).length;
  if(!u||han<Math.max(1,Math.floor(u.length*0.7))) return {ok:false,miss:['phải viết bằng chữ Hán']};
  var i;
  if(it.ok){for(i=0;i<it.ok.length;i++){if(norm(it.ok[i])===u)return {ok:true}}}
  if(!it.need||!it.need.length) return {ok:false,miss:['câu chưa khớp với đáp án mẫu']};
  if(it.min&&han<it.min)miss.push('viết đủ ít nhất '+it.min+' chữ Hán (hiện có '+han+')');
  it.need.forEach(function(n){var re;try{re=new RegExp(n.re)}catch(e){return}if(!re.test(u))miss.push(n.label)});
  (it.no||[]).forEach(function(n){var re;try{re=new RegExp(n.re)}catch(e){return}if(re.test(u))miss.push(n.label)});
  return {ok:miss.length===0,miss:miss};
}
function gradeItem(r){
  var it=r.it,g=r.h,res={ok:false,you:'',key:'',keyVi:false,youVi:false,extra:''};
  var t=it.t;
  if(t==='mcq'){
    var v=g.get();res.ok=(v===it.a);
    res.you=v===null?'(chưa trả lời)':LET[v]+'. '+it.o[v];res.key=LET[it.a]+'. '+it.o[it.a];res.youVi=res.keyVi=!!it.lo;
    g.mark(it.a);
  }else if(t==='tf'){
    var v2=g.get();res.ok=(v2===it.a);
    res.you=v2===null?'(chưa trả lời)':(v2?'Đúng':'Sai');res.key=it.a?'Đúng':'Sai';res.youVi=res.keyVi=true;
    g.mark(it.a);
  }else if(t==='type'){
    var raw=g.get(),u=norm(raw);
    res.ok=it.a.some(function(a){return norm(a)===u});
    res.you=raw.trim()||'(chưa trả lời)';res.key=it.a[0];res.youVi=!raw.trim();
  }else if(t==='bank'){
    var s=g.get();res.ok=(s===it.a);
    res.you=s||'(chưa trả lời)';res.key=it.a;res.youVi=!s||!!r.ex.bankVi;res.keyVi=!!r.ex.bankVi;
  }else if(t==='order'){
    var o=g.get();res.ok=it.acc.some(function(a){return norm(a)===norm(o)});
    res.you=o||'(chưa trả lời)';res.key=it.acc[0];res.youVi=!o;
  }else if(t==='write'||t==='para'){
    var w=g.get();var gr=gradeRules(it,w);res.ok=gr.ok;
    res.you=w.trim()||'(chưa trả lời)';res.key=it.model||'';res.youVi=!w.trim();
    if(!gr.ok&&w.trim())res.extra='Câu trả lời của bạn còn thiếu / chưa đạt: <b>'+gr.miss.map(esc).join('; ')+'</b>.';
  }
  return res;
}

function spy(){
  var secs=[].slice.call(document.querySelectorAll('.sec')),cur=null,exs=[].slice.call(document.querySelectorAll('.ex')),ce=null;
  secs.forEach(function(s){if(s.getBoundingClientRect().top<140)cur=s.id.slice(3)});
  exs.forEach(function(s){if(s.getBoundingClientRect().top<160)ce=s.id.slice(2)});
  if(!cur&&secs[0])cur=secs[0].id.slice(3);
  [].forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-current',b.dataset.sec===cur)});
  [].forEach.call(document.querySelectorAll('.sg .ls a'),function(a){a.setAttribute('aria-current',a.dataset.ex===ce)});
}
window.addEventListener('scroll',spy,{passive:true});
function progress(){
  var bs={},bd={};ALL.forEach(function(r){var k=r.sec.num;bs[k]=(bs[k]||0)+1;if(!r.h.empty())bd[k]=(bd[k]||0)+1});
  [].forEach.call(document.querySelectorAll('[data-sc]'),function(c){c.textContent=(bd[c.dataset.sc]||0)+'/'+(bs[c.dataset.sc]||0)});
  var exd={};ALL.forEach(function(r){var k=r.ex.no;exd[k]=exd[k]||{n:0,d:0};exd[k].n++;if(!r.h.empty())exd[k].d++});
  [].forEach.call(document.querySelectorAll('.sg .ls a'),function(a){var x=exd[a.dataset.ex];a.classList.toggle('done',!!x&&x.d===x.n)});
  spy();
  var done=ALL.filter(function(r){return !r.h.empty()}).length;
  document.getElementById('progFill').style.width=(ALL.length?done/ALL.length*100:0)+'%';
  document.getElementById('progTxt').textContent=done+' / '+ALL.length+' câu';
}

function onSubmit(){
  if(submitted)return;
  var left=ALL.filter(function(r){return r.h.empty()}).length;
  var w=document.getElementById('warn');
  if(left>0&&!w.dataset.ok){
    w.innerHTML='Bạn còn <b>'+left+'</b> câu chưa làm (sẽ tính là sai). Bấm “Nộp bài” lần nữa để nộp luôn, hoặc kéo lên làm tiếp.';
    w.classList.add('on');w.dataset.ok='1';w.scrollIntoView({block:'center',behavior:'smooth'});return;
  }
  doSubmit();
}
